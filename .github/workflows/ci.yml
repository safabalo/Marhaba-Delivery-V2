name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values so config validation and Prisma client generation succeed.
  DATABASE_URL: postgresql://marhaba:marhaba@localhost:5432/marhaba?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
  JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared package
        run: pnpm --filter @marhaba/shared build

      - name: Generate Prisma client
        run: pnpm --filter @marhaba/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma schema / migrate check
        run: pnpm --filter @marhaba/api prisma:migrate:check

      - name: Unit tests
        run: pnpm test

      - name: Build all packages
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: marhaba
          POSTGRES_PASSWORD: marhaba
          POSTGRES_DB: marhaba
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marhaba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared package
        run: pnpm --filter @marhaba/shared build

      - name: Apply database schema
        run: |
          pnpm --filter @marhaba/api prisma:generate
          pnpm --filter @marhaba/api exec prisma db push --skip-generate
          # Strip the Prisma-only "?schema=public" query param; libpq/psql rejects it.
          psql "${DATABASE_URL%%\?*}" -f packages/api/prisma/postgis.sql
          pnpm --filter @marhaba/api prisma:seed

      - name: API e2e tests
        run: pnpm --filter @marhaba/api test:e2e
