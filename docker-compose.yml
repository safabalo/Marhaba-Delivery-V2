services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: marhaba
      POSTGRES_PASSWORD: marhaba
      POSTGRES_DB: marhaba
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marhaba']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      DATABASE_URL: postgresql://marhaba:marhaba@postgres:5432/marhaba?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me-please
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-please
      CORS_ORIGINS: http://localhost:5173
    ports:
      - '3000:3000'
    profiles: ['full']

volumes:
  pgdata:
